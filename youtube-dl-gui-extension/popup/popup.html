<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoutubeDL-GUI Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="Logo" class="brand-icon">
        <span class="brand-title">YoutubeDL-GUI</span>
      </div>
      <div class="header-actions">
        <div id="status-pill" class="status-pill checking" title="Verificando conexão com o aplicativo desktop">
          <span class="status-dot"></span>
          <span id="status-text" class="status-text">Conectando...</span>
        </div>
        <button id="btn-options" class="icon-button" title="Configurações">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Disconnected Alert Banner -->
    <div id="disconnected-banner" class="alert-banner hidden">
      <div class="alert-content">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>O aplicativo desktop não foi detectado.</span>
      </div>
      <button id="btn-reconnect" class="btn-retry">Reconectar</button>
    </div>

    <!-- Active Media Card -->
    <section class="card media-card">
      <div class="card-header">
        <span class="card-label">URL da Página Ativa</span>
      </div>
      <h2 id="media-title" class="media-title">Carregando informações da aba...</h2>
      <div class="url-badge-container">
        <span id="media-url" class="media-url">https://...</span>
        <button id="btn-copy-url" class="btn-copy" title="Copiar URL">
          <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>
    </section>

    <!-- Download Options Form -->
    <section class="card options-card">
      <!-- Format Type Selector (Segmented Control) -->
      <div class="form-group">
        <label class="form-label">Tipo de Download</label>
        <div class="segmented-control">
          <button id="mode-video" class="segment-btn active" type="button">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            Vídeo
          </button>
          <button id="mode-audio" class="segment-btn" type="button">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            Áudio Apenas
          </button>
        </div>
      </div>

      <!-- Quality Selection (for Video) -->
      <div id="group-video-quality" class="form-group">
        <label for="select-quality" class="form-label">Qualidade do Vídeo</label>
        <div class="select-wrapper">
          <select id="select-quality" class="custom-select">
            <option value="Best">⭐ Melhor Disponível (Padrão)</option>
            <option value="UHD_4K">4K Ultra HD (2160p)</option>
            <option value="QHD_1440p">2K Quad HD (1440p)</option>
            <option value="FHD_1080p">Full HD (1080p)</option>
            <option value="HD_720p">HD (720p)</option>
            <option value="SD_480p">SD (480p)</option>
            <option value="Worst">Menor Tamanho (Worst)</option>
          </select>
        </div>
      </div>

      <!-- Audio Format Selection (for Audio) -->
      <div id="group-audio-format" class="form-group hidden">
        <label for="select-audio-format" class="form-label">Formato de Conversão de Áudio</label>
        <div class="select-wrapper">
          <select id="select-audio-format" class="custom-select">
            <option value="Mp3">MP3 (Mais compatível)</option>
            <option value="M4a">M4A / AAC (Alta fidelidade)</option>
            <option value="Opus">OPUS (Melhor compressão)</option>
            <option value="Flac">FLAC (Lossless / Sem perda)</option>
            <option value="Wav">WAV (Sem compressão)</option>
            <option value="BestAudio">Melhor Áudio Original</option>
          </select>
        </div>
      </div>

      <!-- Playlist Toggle Switch -->
      <div class="form-group checkbox-group">
        <label class="switch-container">
          <input type="checkbox" id="chk-playlist">
          <span class="switch-slider"></span>
          <span class="switch-label">Baixar Playlist Completa (se disponível)</span>
        </label>
      </div>

      <!-- Cookies Authentication Toggle Switch -->
      <div class="form-group checkbox-group">
        <label class="switch-container" title="Extrai e envia os cookies da sessão atual para autenticar vídeos restritos, membros ou com verificação de idade">
          <input type="checkbox" id="chk-cookies" checked>
          <span class="switch-slider"></span>
          <span class="switch-label">Enviar cookies da sessão (autenticação)</span>
        </label>
      </div>

      <!-- YouTube Extractor Player Clients Selector -->
      <div class="form-group client-selector-group" id="group-player-clients">
        <div class="label-with-action">
          <label class="form-label" title="Clientes do YouTube emulados pelo yt-dlp como origem do download (deixe nenhum selecionado para o padrão nativo)">Clientes / Origem (player_client)</label>
          <button id="btn-reset-clients" class="btn-link" type="button" title="Restaurar padrão nativo do yt-dlp (nenhum cliente forçado - recomendado)">Padrão</button>
        </div>
        <div class="client-chips-container" id="popup-client-chips">
          <label class="client-chip"><input type="checkbox" name="yt-client" value="android"><span>Android</span></label>
          <label class="client-chip"><input type="checkbox" name="yt-client" value="web"><span>Web</span></label>
          <label class="client-chip"><input type="checkbox" name="yt-client" value="ios"><span>iOS</span></label>
          <label class="client-chip"><input type="checkbox" name="yt-client" value="mweb"><span>M-Web</span></label>
          <label class="client-chip"><input type="checkbox" name="yt-client" value="web_creator"><span>Studio</span></label>
          <label class="client-chip"><input type="checkbox" name="yt-client" value="android_creator"><span>Studio-App</span></label>
          <label class="client-chip"><input type="checkbox" name="yt-client" value="tv"><span>TV</span></label>
          <label class="client-chip"><input type="checkbox" name="yt-client" value="tv_embedded"><span>TV-Emb</span></label>
        </div>
      </div>
    </section>

    <!-- Action Button -->
    <div class="action-container">
      <button id="btn-download" class="btn-primary">
        <span class="btn-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </span>
        <span id="btn-text">Baixar no YoutubeDL-GUI</span>
      </button>
    </div>

    <!-- Status / Mini Dashboard -->
    <footer class="popup-footer">
      <div id="footer-stats" class="footer-stats">
        <span class="stat-item"><strong id="stat-active">0</strong> ativos</span>
        <span class="stat-separator">•</span>
        <span class="stat-item"><strong id="stat-queued">0</strong> na fila</span>
        <span class="stat-separator">•</span>
        <span class="stat-item"><strong id="stat-completed">0</strong> concluídos</span>
      </div>
    </footer>
  </div>

  <script src="../cookieHelper.js"></script>
  <script src="popup.js"></script>
</body>
</html>
